<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- White rounded background -->
  <rect x="4" y="4" width="92" height="92" rx="18" fill="white"/>

  <!-- Circle arc: center(40,50) r=28
       Single small gap at top-right where arrow exits.
       From (62,32) counterclockwise ~340° to (67,41) -->
  <path d="M 62 32 A 28 28 0 1 0 67 41"
        stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Trend line: bottom-left → W-zigzag → exits through gap top-right -->
  <path d="M 10 73 L 20 56 L 30 61 L 50 44 L 75 22"
        stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrowhead at (75,22) -->
  <path d="M 64 20 L 75 22 L 72 33"
        stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coin stack: 3 coins INSIDE the circle, bottom-right area -->
  <!-- Bottom coin (full ellipse) -->
  <ellipse cx="55" cy="72" rx="10" ry="3.5"
           stroke="#1a1a1a" stroke-width="2.3" fill="none"/>
  <!-- Side walls bottom→middle -->
  <line x1="45" y1="68" x2="45" y2="72"
        stroke="#1a1a1a" stroke-width="2.3" stroke-linecap="round"/>
  <line x1="65" y1="68" x2="65" y2="72"
        stroke="#1a1a1a" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Middle coin top arc -->
  <path d="M 45 68 A 10 3.5 0 0 1 65 68"
        stroke="#1a1a1a" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Side walls middle→top -->
  <line x1="45" y1="64" x2="45" y2="68"
        stroke="#1a1a1a" stroke-width="2.3" stroke-linecap="round"/>
  <line x1="65" y1="64" x2="65" y2="68"
        stroke="#1a1a1a" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Top coin arc -->
  <path d="M 45 64 A 10 3.5 0 0 1 65 64"
        stroke="#1a1a1a" stroke-width="2.3" stroke-linecap="round"/>
</svg>
