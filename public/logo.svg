<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular arc: center(40,46) r=30
       From top-right (63,28) counterclockwise (long way ~285°) to bottom-right (61,70)
       Gap at top-right (arrow exits) and bottom-right (coin stack sits) -->
  <path d="M 63 28 A 30 30 0 1 0 61 70"
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Rising trend line: enters from bottom-left, waves up, exits top-right as arrow -->
  <path d="M 10 72 L 24 56 L 38 63 L 55 40 L 74 20"
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrowhead at top-right -->
  <path d="M 62 18 L 74 20 L 72 32"
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coin stack: 3 coins stacked at bottom-right, sitting just below the arc gap -->
  <!-- Bottom coin (full ellipse) -->
  <ellipse cx="64" cy="82" rx="11" ry="4"
           stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <!-- Side walls bottom→middle -->
  <line x1="53" y1="77" x2="53" y2="82"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="77" x2="75" y2="82"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Middle coin top arc -->
  <path d="M 53 77 A 11 4 0 0 1 75 77"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Side walls middle→top -->
  <line x1="53" y1="72" x2="53" y2="77"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="72" x2="75" y2="77"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Top coin arc -->
  <path d="M 53 72 A 11 4 0 0 1 75 72"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
