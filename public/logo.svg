<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <!--
    N.RiseUp logo — exact recreation of reference image
    Circle arc + rising trend line with W-shape + arrow + coin stack
    Transparent background, pure black (#000000) strokes
  -->

  <!-- Large circle arc: center(215,215) r=170
       From 6-o'clock (215,385) clockwise 210° to 1-o'clock (300,68)
       Gap on lower-right side where coins sit and arrow exits -->
  <path d="M 215 385 A 170 170 0 1 1 300 68"
        stroke="#000000" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Rising trend line: lower-left → W-shape → straight arrow shaft -->
  <!-- Ends at the base of the arrowhead (415,70) -->
  <path d="M 18 425 L 100 185 L 165 265 L 272 163 L 415 70"
        stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>

  <!-- Filled arrowhead: tip at (453,46), pointing upper-right
       Direction from last trend segment (272,163)→(415,70): angle ≈ 33° above horizontal -->
  <polygon points="453,46 403,52 427,90" fill="#000000"/>

  <!-- Coin stack: 2 stacked coins, lower-right area (inside circle gap) -->
  <!-- Bottom coin — full ellipse -->
  <ellipse cx="320" cy="375" rx="52" ry="19"
           stroke="#000000" stroke-width="13" fill="none"/>
  <!-- Cylinder side walls -->
  <line x1="268" y1="353" x2="268" y2="375"
        stroke="#000000" stroke-width="13" stroke-linecap="round"/>
  <line x1="372" y1="353" x2="372" y2="375"
        stroke="#000000" stroke-width="13" stroke-linecap="round"/>
  <!-- Top coin — upper arc only -->
  <path d="M 268 353 A 52 19 0 0 1 372 353"
        stroke="#000000" stroke-width="13" stroke-linecap="round" fill="none"/>
</svg>
